<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>灵感挖掘机 - 触摸屏版</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">灵感挖掘机</h1>
      <span class="subtitle">触摸屏版</span>
    </header>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="mindMapCanvas"></canvas>
      <div class="touch-controls">
        <button class="touch-btn" id="zoomInBtn" title="放大">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </button>
        <button class="touch-btn" id="zoomOutBtn" title="缩小">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13H5v-2h14v2z"/>
          </svg>
        </button>
        <button class="touch-btn" id="resetViewBtn" title="重置视图">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          </svg>
        </button>
        <button class="touch-btn" id="centerBtn" title="居中">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="toolbar">
      <button class="tool-btn" id="addRootBtn" data-action="addRoot">
        <span class="tool-icon">+</span>
        <span class="tool-label">新建根节点</span>
      </button>
      <button class="tool-btn" id="addChildBtn" data-action="addChild">
        <span class="tool-icon">↳</span>
        <span class="tool-label">添加子节点</span>
      </button>
      <button class="tool-btn" id="editBtn" data-action="edit">
        <span class="tool-icon">✏️</span>
        <span class="tool-label">编辑</span>
      </button>
      <button class="tool-btn" id="deleteBtn" data-action="delete">
        <span class="tool-icon">🗑️</span>
        <span class="tool-label">删除</span>
      </button>
    </div>

    <div class="action-bar">
      <button class="action-btn" id="aiChatBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
        </svg>
        <span>AI 对话</span>
      </button>
      <button class="action-btn" id="clearBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
        <span>清空</span>
      </button>
      <button class="action-btn" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        <span>导出</span>
      </button>
    </div>

    <div class="status-bar">
      <span id="nodeCount">节点: 0</span>
      <span id="zoomLevel">缩放: 100%</span>
    </div>
  </div>

  <div id="contextMenu" class="context-menu">
    <button class="context-item" data-action="addChild">
      <span class="context-icon">↳</span>
      <span>添加子节点</span>
    </button>
    <button class="context-item" data-action="edit">
      <span class="context-icon">✏️</span>
      <span>编辑</span>
    </button>
    <button class="context-item" data-action="connect">
      <span class="context-icon">🔗</span>
      <span>连接节点</span>
    </button>
    <button class="context-item" data-action="delete">
      <span class="context-icon">🗑️</span>
      <span>删除</span>
    </button>
  </div>

  <div id="inputModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">输入内容</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="nodeInput" class="node-input" placeholder="请输入内容..." autocomplete="off">
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" id="modalCancel">取消</button>
        <button class="modal-btn modal-btn-confirm" id="modalConfirm">确认</button>
      </div>
    </div>
  </div>

  <div id="aiChatPanel" class="chat-panel">
    <div class="chat-header">
      <h3>AI 智能对话</h3>
      <button class="chat-close" id="chatClose">&times;</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-container">
      <textarea id="chatInput" class="chat-input" placeholder="输入消息与 AI 对话..." rows="2"></textarea>
      <button class="chat-send" id="chatSend">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="ai-service.js"></script>
  <script src="app.js"></script>
</body>
</html>
