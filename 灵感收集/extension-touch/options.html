<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>设置 - 灵感挖掘机 触摸屏版</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <h1>设置</h1>
      <span class="subtitle">触摸屏版</span>
    </header>

    <div class="settings-content">
      <section class="settings-section">
        <h2>AI 服务配置</h2>
        <p class="section-desc">配置 GLM-4.7 API 以启用 AI 智能对话功能</p>

        <div class="form-group">
          <label for="apiKey">API Key</label>
          <input type="password" id="apiKey" class="settings-input" placeholder="输入您的 API Key" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="apiEndpoint">API 地址</label>
          <input type="text" id="apiEndpoint" class="settings-input" placeholder="https://api.xxx.com/v1/chat/completions">
        </div>

        <div class="form-group">
          <label for="model">模型名称</label>
          <input type="text" id="model" class="settings-input" placeholder="glm-4.7" value="glm-4.7">
        </div>

        <button class="settings-btn primary" id="saveConfig">保存配置</button>
        <button class="settings-btn secondary" id="testConnection">测试连接</button>
      </section>

      <section class="settings-section">
        <h2>触摸设置</h2>

        <div class="setting-item">
          <div class="setting-info">
            <label>长按显示菜单</label>
            <p class="setting-desc">在节点上长按可弹出操作菜单</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="longPressMenu" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <div class="setting-info">
            <label>双指缩放</label>
            <p class="setting-desc">使用双指捏合来缩放思维导图</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="pinchZoom" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <div class="setting-info">
            <label>振动反馈</label>
            <p class="setting-desc">操作时触发轻微振动（需要设备支持）</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="hapticFeedback">
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <section class="settings-section">
        <h2>数据管理</h2>

        <button class="settings-btn secondary" id="exportData">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          导出数据
        </button>

        <button class="settings-btn secondary" id="importData">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
          </svg>
          导入数据
        </button>

        <button class="settings-btn danger" id="clearData">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
          </svg>
          清空所有数据
        </button>
        <input type="file" id="importFile" accept=".json" style="display: none;">
      </section>

      <section class="settings-section">
        <h2>关于</h2>
        <div class="about-info">
          <p><strong>灵感挖掘机 - 触摸屏版</strong></p>
          <p>版本 1.0.0</p>
          <p class="about-desc">专为触摸屏设备优化的思维导图工具，支持 AI 智能对话和手势操作。</p>
        </div>
      </section>
    </div>

    <nav class="bottom-nav">
      <a href="popup.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>思维导图</span>
      </a>
      <a href="options.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        <span>设置</span>
      </a>
    </nav>
  </div>

  <script src="options.js"></script>
</body>
</html>
