<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .test-button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .test-button:hover {
            background-color: #45a049;
        }
        .test-results {
            margin-top: 20px;
        }
        .test-item {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .test-item h3 {
            margin-top: 0;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        .stat-item {
            background-color: #f8f9fa;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .chart-container {
            margin-top: 10px;
            height: 200px;
            background-color: #f8f9fa;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .chart-bar {
            position: absolute;
            bottom: 0;
            background-color: #4CAF50;
            width: 20px;
            margin: 0 5px;
            transition: height 0.3s ease;
        }
        .chart-label {
            position: absolute;
            bottom: -20px;
            font-size: 10px;
            text-align: center;
            width: 30px;
        }
        .summary {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>本地阅读应用性能测试</h1>
        <p>点击下方按钮运行性能测试：</p>
        <button class="test-button" onclick="runPerformanceTests()">运行性能测试</button>
        
        <div class="test-results" id="performanceResults">
            <!-- 性能测试结果将显示在这里 -->
        </div>
        
        <div class="summary" id="performanceSummary">
            <!-- 性能测试摘要将显示在这里 -->
        </div>
    </div>

    <script>
        async function runPerformanceTests() {
            const resultsDiv = document.getElementById('performanceResults');
            const summaryDiv = document.getElementById('performanceSummary');
            
            resultsDiv.innerHTML = '<p>正在运行性能测试...</p>';
            summaryDiv.innerHTML = '';
            
            try {
                // 创建一个iframe来加载应用页面
                const iframe = document.createElement('iframe');
                iframe.src = 'http://localhost:8000';
                iframe.style.display = 'none';
                iframe.width = '800';
                iframe.height = '600';
                
                document.body.appendChild(iframe);
                
                // 等待iframe加载完成
                await new Promise((resolve) => {
                    iframe.onload = resolve;
                });
                
                // 运行iframe中的性能测试脚本
                const performanceResults = await iframe.contentWindow.runAllPerformanceTests();
                
                // 显示测试结果
                displayPerformanceResults(performanceResults);
                
                // 移除iframe
                document.body.removeChild(iframe);
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: red;">性能测试执行失败：${error.message}</p>`;
            }
        }
        
        function displayPerformanceResults(performanceResults) {
            const resultsDiv = document.getElementById('performanceResults');
            const summaryDiv = document.getElementById('performanceSummary');
            
            // 清空之前的结果
            resultsDiv.innerHTML = '';
            summaryDiv.innerHTML = '';
            
            // 显示每个测试结果
            performanceResults.forEach(result => {
                const testItem = document.createElement('div');
                testItem.className = 'test-item';
                
                // 创建统计数据网格
                const statGrid = document.createElement('div');
                statGrid.className = 'stat-grid';
                statGrid.innerHTML = `
                    <div class="stat-item">
                        <strong>迭代次数:</strong> ${result.iterations}
                    </div>
                    <div class="stat-item">
                        <strong>最小时间:</strong> ${result.min.toFixed(2)}ms
                    </div>
                    <div class="stat-item">
                        <strong>最大时间:</strong> ${result.max.toFixed(2)}ms
                    </div>
                    <div class="stat-item">
                        <strong>平均时间:</strong> ${result.avg.toFixed(2)}ms
                    </div>
                    <div class="stat-item">
                        <strong>中位数时间:</strong> ${result.median.toFixed(2)}ms
                    </div>
                `;
                
                // 创建简单的柱状图
                const chartContainer = document.createElement('div');
                chartContainer.className = 'chart-container';
                
                const maxValue = Math.max(...result.rawData);
                result.rawData.forEach((value, index) => {
                    const bar = document.createElement('div');
                    bar.className = 'chart-bar';
                    bar.style.left = `${index * 30}px`;
                    bar.style.height = `${(value / maxValue) * 100}%`;
                    
                    const label = document.createElement('div');
                    label.className = 'chart-label';
                    label.style.left = `${index * 30 - 5}px`;
                    label.textContent = `${value.toFixed(0)}ms`;
                    
                    chartContainer.appendChild(bar);
                    chartContainer.appendChild(label);
                });
                
                testItem.innerHTML = `<h3>${result.name}</h3>`;
                testItem.appendChild(statGrid);
                testItem.appendChild(chartContainer);
                
                resultsDiv.appendChild(testItem);
            });
            
            // 显示测试摘要
            summaryDiv.innerHTML = `
                <h3>性能测试摘要</h3>
                <p>测试用例数量：${performanceResults.length}</p>
                <p>测试完成时间：${new Date().toLocaleString()}</p>
            `;
        }
    </script>
</body>
</html>
