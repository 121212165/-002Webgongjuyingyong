<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地阅读应用</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导入页面 -->
    <div id="importPage" class="page">
        <div class="import-container">
            <h1>本地阅读应用</h1>
            <p>请导入您的书籍文件或扫描目录</p>
            <div class="import-options">
                <label for="fileInput" class="import-btn">
                    <input type="file" id="fileInput" accept=".txt,.epub,.pdf,.mobi,.azw,.azw3" style="display: none;">
                    <span>选择文件</span>
                </label>
                <label for="directoryInput" class="import-btn">
                    <input type="file" id="directoryInput" webkitdirectory directory multiple style="display: none;">
                    <span>扫描目录</span>
                </label>
                <div class="drag-area" id="dragArea">
                    <span>或拖拽文件到此处</span>
                </div>
            </div>
            <div class="library-section">
                <div class="library-header">
                    <h2>我的图书馆</h2>
                    <div class="library-controls">
                        <button id="scanDirectoryBtn" class="library-btn">重新扫描</button>
                        <input type="text" id="searchInput" placeholder="搜索书籍..." class="search-input">
                        <select id="sortSelect" class="sort-select">
                            <option value="title">按标题排序</option>
                            <option value="author">按作者排序</option>
                            <option value="date">按日期添加</option>
                        </select>
                    </div>
                </div>
                <div class="book-library" id="bookLibrary">
                    <!-- 书籍库将通过JavaScript动态生成 -->
                </div>
            </div>
            <div class="recent-books" id="recentBooks">
                <h2>最近阅读</h2>
                <div class="book-list" id="bookList"></div>
            </div>
        </div>
    </div>

    <!-- 阅读器页面 -->
    <div id="readerPage" class="page" style="display: none;">
        <!-- 顶部导航栏 -->
        <header class="reader-header">
            <div class="header-left">
                <button id="backBtn" class="header-btn">返回</button>
                <span id="bookTitle" class="book-title"></span>
            </div>
            <div class="header-right">
                <button id="menuBtn" class="header-btn">目录</button>
                <button id="bookmarkBtn" class="header-btn">书签</button>
            </div>
        </header>

        <!-- 阅读内容区域 -->
        <main class="reader-content" id="readerContent">
            <!-- 内容将通过JavaScript动态生成 -->
        </main>

        <!-- 底部工具栏 -->
        <footer class="reader-footer">
            <div class="footer-left">
                <button id="prevBtn" class="footer-btn">上一章</button>
                <span id="progressText" class="progress-text">0%</span>
                <button id="nextBtn" class="footer-btn">下一章</button>
            </div>
            <div class="footer-right">
                <button id="settingsBtn" class="footer-btn">设置</button>
            </div>
        </footer>

        <!-- 侧边栏菜单 -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3 id="sidebarTitle">目录</h3>
                <button id="closeSidebar" class="sidebar-close">关闭</button>
            </div>
            <div class="sidebar-content" id="sidebarContent">
                <!-- 目录或书签列表将通过JavaScript动态生成 -->
            </div>
        </div>

        <!-- 设置面板 -->
        <div id="settingsPanel" class="settings-panel">
            <div class="settings-content">
                <div class="settings-header">
                    <h3>阅读设置</h3>
                    <button id="closeSettings" class="settings-close">关闭</button>
                </div>
                <div class="settings-section">
                    <h4>主题</h4>
                    <div class="theme-options">
                        <button id="dayMode" class="theme-btn active">日间</button>
                        <button id="nightMode" class="theme-btn">夜间</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h4>字体大小</h4>
                    <div class="font-size-control">
                        <button id="decreaseFont" class="font-btn">A-</button>
                        <span id="fontSizeDisplay" class="font-size-display">16</span>
                        <button id="increaseFont" class="font-btn">A+</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h4>阅读统计</h4>
                    <div class="reading-stats">
                        <p>总阅读时长: <span id="totalReadingTime">0</span> 分钟</p>
                        <p>本次阅读: <span id="currentReadingTime">0</span> 分钟</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 遮罩层 -->
        <div id="overlay" class="overlay" style="display: none;"></div>
    </div>

    <script src="epub.js"></script>
    <script src="reader.js"></script>
    <script src="indexeddb.js"></script>
    <script>
    class ReaderApp {
        constructor() { this.reader = new Reader(); this.recentBooks = []; this.library = []; this.init(); }
        async init() { this.bindEvents(); this.loadRecentBooks(); await this.loadLibrary(); this.renderLibrary(); this.renderRecentBooks(); }
        bindEvents() {
            document.getElementById('fileInput').addEventListener('change', e => this.handleFileSelect(e));
            document.getElementById('directoryInput').addEventListener('change', e => this.handleDirectorySelect(e));
            const dragArea = document.getElementById('dragArea');
            dragArea.addEventListener('dragover', e => { e.preventDefault(); dragArea.classList.add('dragover'); });
            dragArea.addEventListener('dragleave', () => dragArea.classList.remove('dragover'));
            dragArea.addEventListener('drop', e => { e.preventDefault(); dragArea.classList.remove('dragover'); if (e.dataTransfer.files.length) this.processFile(e.dataTransfer.files[0]); });
            document.getElementById('scanDirectoryBtn')?.addEventListener('click', () => document.getElementById('directoryInput').click());
            document.getElementById('searchInput')?.addEventListener('input', e => this.renderLibrary(e.target.value));
            document.getElementById('sortSelect')?.addEventListener('change', e => this.renderLibrary('', e.target.value));
            document.getElementById('backBtn')?.addEventListener('click', () => this.goBack());
            document.getElementById('menuBtn')?.addEventListener('click', () => this.reader.showSidebar('toc'));
            document.getElementById('bookmarkBtn')?.addEventListener('click', () => { this.reader.toggleBookmark(); document.getElementById('bookmarkBtn').classList.toggle('active'); });
            document.getElementById('prevBtn')?.addEventListener('click', () => this.reader.prevChapter());
            document.getElementById('nextBtn')?.addEventListener('click', () => this.reader.nextChapter());
            document.getElementById('settingsBtn')?.addEventListener('click', () => this.reader.showSettings());
            document.getElementById('closeSidebar')?.addEventListener('click', () => this.reader.closeSidebar());
            document.getElementById('overlay')?.addEventListener('click', () => this.reader.closeSidebar());
            document.getElementById('closeSettings')?.addEventListener('click', () => this.reader.closeSettings());
            document.getElementById('dayMode')?.addEventListener('click', () => this.reader.toggleTheme('day'));
            document.getElementById('nightMode')?.addEventListener('click', () => this.reader.toggleTheme('night'));
            document.getElementById('decreaseFont')?.addEventListener('click', () => this.reader.adjustFontSize(-1));
            document.getElementById('increaseFont')?.addEventListener('click', () => this.reader.adjustFontSize(1));
        }
        async handleFileSelect(e) { if (e.target.files[0]) await this.processFile(e.target.files[0]); }
        async handleDirectorySelect(e) {
            const files = Array.from(e.target.files).filter(f => ['.txt','.epub','.pdf','.mobi','.azw','.azw3'].includes('.' + f.name.split('.').pop().toLowerCase()));
            for (const f of files) await this.processFile(f, false);
            this.showToast(`处理完成 ${files.length} 个文件`);
        }
        async processFile(file, switchToReader = true) {
            try {
                document.getElementById('readerContent').innerHTML = '<div style="text-align:center;padding:2rem">加载中...</div>';
                const parser = FileParserFactory.getParser(file);
                const bookData = await parser.parse(file);
                this.addToLibrary(bookData, file);
                this.addToRecentBooks(bookData.title, file.name);
                if (switchToReader) { this.switchToReader(); this.reader.init(); await this.reader.loadBook(bookData); }
                this.renderLibrary(); this.renderRecentBooks();
            } catch (err) { console.error(err); this.showToast('文件处理失败'); }
        }
        addToLibrary(bookData, file) {
            if (!this.library.find(b => b.title === bookData.title)) {
                this.library.push({ id: Date.now(), title: bookData.title, author: bookData.author || '未知作者', fileName: file.name, fileSize: file.size, fileType: file.name.split('.').pop().toLowerCase(), addedDate: new Date().toISOString() });
                localStorage.setItem('bookLibrary', JSON.stringify(this.library));
            }
        }
        loadLibrary() { try { this.library = JSON.parse(localStorage.getItem('bookLibrary') || '[]'); } catch { this.library = []; } }
        renderLibrary(search = '', sort = 'title') {
            const el = document.getElementById('bookLibrary'); if (!el) return;
            let books = search ? this.library.filter(b => b.title.toLowerCase().includes(search)) : [...this.library];
            books.sort((a, b) => sort === 'date' ? new Date(b.addedDate) - new Date(a.addedDate) : (a[sort] || '').localeCompare(b[sort] || ''));
            el.innerHTML = books.length ? books.map(b => `<div class="book-item" data-id="${b.id}"><div class="book-cover"></div><h3>${b.title}</h3><p class="book-meta"><small>${b.author}</small><br><small>${new Date(b.addedDate).toLocaleDateString()}</small></p></div>`).join('') : '<div style="text-align:center;color:#999;padding:2rem">暂无书籍</div>';
            el.querySelectorAll('.book-item').forEach(item => item.addEventListener('click', () => this.showToast('请重新选择文件以打开书籍')));
        }
        addToRecentBooks(title, fileName) { this.recentBooks = this.recentBooks.filter(b => b.title !== title); this.recentBooks.unshift({ title, fileName, lastRead: new Date().toISOString() }); if (this.recentBooks.length > 10) this.recentBooks.pop(); localStorage.setItem('recentBooks', JSON.stringify(this.recentBooks)); }
        loadRecentBooks() { try { this.recentBooks = JSON.parse(localStorage.getItem('recentBooks') || '[]'); } catch { this.recentBooks = []; } }
        renderRecentBooks() {
            const el = document.getElementById('bookList'); if (!el) return;
            el.innerHTML = this.recentBooks.length ? this.recentBooks.map(b => `<div class="book-item" data-title="${b.title}"><h3>${b.title}</h3><p class="book-meta"><small>${b.fileName}</small><br><small>${new Date(b.lastRead).toLocaleString()}</small></p></div>`).join('') : '<p style="text-align:center;color:#999;margin-top:1rem">暂无阅读记录</p>';
        }
        switchToReader() { document.getElementById('importPage').style.display = 'none'; document.getElementById('readerPage').style.display = 'block'; }
        goBack() { this.reader.saveProgress(); this.reader.stopReadingTimer(); document.getElementById('importPage').style.display = 'block'; document.getElementById('readerPage').style.display = 'none'; this.loadRecentBooks(); this.renderRecentBooks(); }
        showToast(msg) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
    }
    document.addEventListener('DOMContentLoaded', () => new ReaderApp());
    </script>
</body>
</html>
