<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>深度阅读器 - 智能笔记版本管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #667eea;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --info-color: #2196f3;
            --text-color: #333;
            --bg-color: #f5f7fa;
            --white: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.15);
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-color);
            overflow-x: hidden;
        }
        
        /* 主容器 */
        .main-container {
            display: flex;
            height: 100vh;
            gap: 1rem;
            padding: 1rem;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 350px;
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        
        .sidebar-header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .sidebar-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .sidebar-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        
        /* Git 状态面板 */
        .git-status {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--success-color);
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            color: #666;
        }
        
        .status-value {
            font-weight: 500;
            color: var(--primary-color);
        }
        
        /* 操作按钮组 */
        .action-group {
            margin-bottom: 2rem;
        }
        
        .action-group h3 {
            color: var(--primary-color);
            font-size: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            text-align: left;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-success {
            background: linear-gradient(45deg, var(--success-color), #66bb6a);
        }
        
        .btn-warning {
            background: linear-gradient(45deg, var(--warning-color), #ffb74d);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, var(--danger-color), #ef5350);
        }
        
        .btn-info {
            background: linear-gradient(45deg, var(--info-color), #42a5f5);
        }
        
        /* 提交历史 */
        .commit-history {
            margin-top: 1rem;
        }
        
        .commit-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-left: 3px solid var(--primary-color);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .commit-item:hover {
            background: #e3f2fd;
            transform: translateX(4px);
        }
        
        .commit-message {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        
        .commit-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #666;
        }
        
        .commit-hash {
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }
        
        /* 主工作区 */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        /* 编辑器区域 */
        .editor-area {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        
        .editor-header {
            background: var(--white);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .editor-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;

        .editor-controls {
            display: flex;
            gap: 0.5rem;
        }
        
        .editor-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        
        .note-editor {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            background: transparent;
        }
        
        /* 差异对比区域 */
        .diff-area {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            height: 300px;
            overflow: hidden;
            display: none;
        }
        
        .diff-area.active {
            display: flex;
            flex-direction: column;
        }
        
        .diff-header {
            background: #f8f9fa;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #eee;
            font-weight: 500;
            color: var(--primary-color);
        }
        
        .diff-content {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .diff-line {
            padding: 0.2rem 0.5rem;
            margin: 0.1rem 0;
            border-radius: 3px;
        }
        
        .diff-added {
            background: rgba(76, 175, 80, 0.1);
            border-left: 3px solid var(--success-color);
        }
        
        .diff-removed {
            background: rgba(244, 67, 54, 0.1);
            border-left: 3px solid var(--danger-color);
        }
        
        .diff-unchanged {
            color: #666;
        }
        
        /* 输入框样式 */
        .input-group {
            margin-bottom: 1rem;
        }
        
        .input-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-color);
        }
        
        .input-field {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
        }
        
        .textarea-field {
            min-height: 80px;
            resize: vertical;
        }
        
        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-hover);
        }
        
        .modal-header {
            margin-bottom: 1.5rem;
        }
        
        .modal-title {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }
        
        /* 状态指示器 */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .status-clean {
            background: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
        }
        
        .status-modified {
            background: rgba(255, 152, 0, 0.1);
            color: var(--warning-color);
        }
        
        .status-staged {
            background: rgba(33, 150, 243, 0.1);
            color: var(--info-color);
        }
        
        /* 文件列表 */
        .file-list {
            margin-top: 1rem;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-radius: 6px;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .file-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        .file-name {
            font-family: 'Courier New', monospace;
        }
        
        .file-status {
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
        }
        
        .file-modified {
            background: rgba(255, 152, 0, 0.2);
            color: var(--warning-color);
        }
        
        .file-added {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success-color);
        }
        
        .file-deleted {
            background: rgba(244, 67, 54, 0.2);
            color: var(--danger-color);
        }
        
        /* 动画效果 */
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            
            .sidebar {
                width: 100%;
                order: 2;
            }
            
            .workspace {
                order: 1;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }
    </style>

## 今日阅读：认知心理学

### 核心观点
- 认知心理学将人类大脑比作信息处理系统
- 注意力是认知系统的门户，资源有限
- 记忆系统分为感觉记忆、短期记忆和长期记忆

### 重要概念
**选择性注意**：在众多刺激中选择特定信息的能力

**确认偏见**：倾向于寻找和解释支持既有信念的信息

### 个人思考

### 应用启示
1. 在学习时要有意识地对抗确认偏见
2. 利用间隔重复来增强记忆
3. 设计更符合认知特点的学习方法

    <script>
        // Git 版本管理系统模拟
        class GitNotesManager {
            constructor() {
                this.currentBranch = 'main';
                this.commits = [];
                this.branches = ['main'];
                this.currentContent = '';
                this.lastSavedContent = '';
                this.files = new Map();
                this.currentFile = '我的笔记.md';
                
                this.loadFromStorage();
                this.updateUI();
            }
            
            // 保存笔记
            saveNote() {
                const content = document.getElementById('noteEditor').value;
                const fileName = document.getElementById('currentFileName').textContent;
                
                this.files.set(fileName, {
                    content: content,
                    lastModified: new Date().toISOString(),
                    status: content !== this.lastSavedContent ? 'modified' : 'clean'
                });
                
                this.currentContent = content;
                this.updateFileList();
                this.updateStatus();
                this.saveToStorage();
                
                this.showToast('笔记已保存', 'success');
            }
            
            // 创建提交
            commit(message, description = '') {
                const timestamp = new Date().toISOString();
                const commitId = this.generateCommitId();
                
                const commit = {
                    id: commitId,
                    message: message,
                    description: description,
                    timestamp: timestamp,
                    branch: this.currentBranch,
                    files: new Map(this.files),
                    author: 'Reader User'
                };
                
                this.commits.unshift(commit);
                this.lastSavedContent = this.currentContent;
                
                // 更新文件状态
                this.files.forEach((file, fileName) => {
                    file.status = 'clean';
                });
                
                this.updateUI();
                this.saveToStorage();
                
                this.showToast(`提交成功: ${message}`, 'success');
            }
            
            // 创建分支
            createBranch(branchName, description = '') {
                if (this.branches.includes(branchName)) {
                    this.showToast('分支名称已存在', 'error');
                    return false;
                }
                
                this.branches.push(branchName);
                this.currentBranch = branchName;
                
                // 创建分支提交
                this.commit(`创建分支: ${branchName}`, description);
                
                this.updateUI();
                this.showToast(`分支 "${branchName}" 创建成功`, 'success');
                return true;
            }
            
            // 切换分支
            switchBranch(branchName) {
                if (!this.branches.includes(branchName)) {
                    this.showToast('分支不存在', 'error');
                    return;
                }
                
                this.currentBranch = branchName;
                
                // 加载分支的最新内容
                const branchCommits = this.commits.filter(c => c.branch === branchName);
                if (branchCommits.length > 0) {
                    const latestCommit = branchCommits[0];
                    const file = latestCommit.files.get(this.currentFile);
                    if (file) {
                        document.getElementById('noteEditor').value = file.content;
                        this.currentContent = file.content;
                        this.lastSavedContent = file.content;
                    }
                }
                
                this.updateUI();
                this.showToast(`已切换到分支: ${branchName}`, 'info');
            }
            
            // 生成差异对比
            generateDiff() {
                const current = this.currentContent;
                const saved = this.lastSavedContent;
                
                if (current === saved) {
                    return '<div style="text-align: center; color: #666; padding: 2rem;">没有更改</div>';
                }
                
                const currentLines = current.split('\n');
                const savedLines = saved.split('\n');
                
                let diffHtml = '';
                const maxLines = Math.max(currentLines.length, savedLines.length);
                
                for (let i = 0; i < maxLines; i++) {
                    const currentLine = currentLines[i] || '';
                    const savedLine = savedLines[i] || '';
                    
                    if (currentLine === savedLine) {
                        if (currentLine) {
                            diffHtml += `<div class="diff-line diff-unchanged">  ${this.escapeHtml(currentLine)}</div>`;
                        }
                    } else {
                        if (savedLine) {
                            diffHtml += `<div class="diff-line diff-removed">- ${this.escapeHtml(savedLine)}</div>`;
                        }
                        if (currentLine) {
                            diffHtml += `<div class="diff-line diff-added">+ ${this.escapeHtml(currentLine)}</div>`;
                        }
                    }
                }
                
                return diffHtml || '<div style="text-align: center; color: #666; padding: 2rem;">没有更改</div>';
            }
            
            // 更新UI
            updateUI() {
                this.updateStatus();
                this.updateFileList();
                this.updateCommitHistory();
            }
            
            // 更新状态
            updateStatus() {
                const hasChanges = this.currentContent !== this.lastSavedContent;
                const pendingChanges = hasChanges ? 1 : 0;
                
                document.getElementById('currentBranch').textContent = this.currentBranch;
                document.getElementById('pendingChanges').textContent = pendingChanges;
                document.getElementById('totalCommits').textContent = this.commits.length;
                
                const statusElement = document.getElementById('repoStatus');
                if (hasChanges) {
                    statusElement.className = 'status-indicator status-modified';
                    statusElement.innerHTML = '<span>⚠️</span><span>有更改</span>';
                } else {
                    statusElement.className = 'status-indicator status-clean';
                    statusElement.innerHTML = '<span>✅</span><span>已同步</span>';
                }
            }
            
            // 更新文件列表
            updateFileList() {
                const fileList = document.getElementById('fileList');
                
                if (this.files.size === 0) {
                    fileList.innerHTML = `
                        <div style="text-align: center; color: #666; padding: 1rem;">
                            <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">📄</div>
                            <p>暂无文件</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                this.files.forEach((file, fileName) => {
                    const statusClass = `file-${file.status}`;
                    const statusText = {
                        'clean': '已同步',
                        'modified': '已修改',
                        'added': '新增',
                        'deleted': '已删除'
                    }[file.status] || '未知';
                    
                    html += `
                        <div class="file-item" onclick="loadFile('${fileName}')">
                            <span class="file-name">${fileName}</span>
                            <span class="file-status ${statusClass}">${statusText}</span>
                        </div>
                    `;
                });
                
                fileList.innerHTML = html;
            }
            
            // 更新提交历史
            updateCommitHistory() {
                const historyElement = document.getElementById('commitHistory');
                
                if (this.commits.length === 0) {
                    historyElement.innerHTML = `
                        <div style="text-align: center; color: #666; padding: 1rem;">
                            <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">🕐</div>
                            <p>暂无提交记录</p>
                        </div>
                    `;
                    return;
                }
                
                const html = this.commits.slice(0, 10).map(commit => `
                    <div class="commit-item fade-in" onclick="viewCommit('${commit.id}')">
                        <div class="commit-message">${this.escapeHtml(commit.message)}</div>
                        <div class="commit-meta">
                            <span class="commit-hash">${commit.id.substring(0, 7)}</span>
                            <span>${this.formatDate(commit.timestamp)}</span>
                        </div>
                    </div>
                `).join('');
                
                historyElement.innerHTML = html;
            }
            
            // 工具方法
            generateCommitId() {
                return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diff = now - date;
                
                if (diff < 60000) {
                    return '刚刚';
                } else if (diff < 3600000) {
                    return Math.floor(diff / 60000) + '分钟前';
                } else if (diff < 86400000) {
                    return Math.floor(diff / 3600000) + '小时前';
                } else {
                    return date.toLocaleDateString('zh-CN');
                }
            }
            
            showToast(message, type = 'info') {
                const toast = document.createElement('div');
                const colors = {
                    success: '#4caf50',
                    error: '#f44336',
                    warning: '#ff9800',
                    info: '#2196f3'
                };
                
                toast.style.cssText = `
                    position: fixed;
                    top: 2rem;
                    right: 2rem;
                    background: ${colors[type]};
                    color: white;
                    padding: 1rem 1.5rem;
                    border-radius: 8px;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
                    z-index: 3000;
                    animation: fadeIn 0.3s ease-out;
                `;
                toast.textContent = message;
                
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.animation = 'fadeIn 0.3s ease-out reverse';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
            
            // 存储管理
            saveToStorage() {
                const data = {
                    currentBranch: this.currentBranch,
                    commits: this.commits,
                    branches: this.branches,
                    files: Array.from(this.files.entries()),
                    currentFile: this.currentFile,
                    lastSavedContent: this.lastSavedContent
                };
                localStorage.setItem('gitNotesData', JSON.stringify(data));
            }
            
            loadFromStorage() {
                const saved = localStorage.getItem('gitNotesData');
                if (saved) {
                    const data = JSON.parse(saved);
                    this.currentBranch = data.currentBranch || 'main';
                    this.commits = data.commits || [];
                    this.branches = data.branches || ['main'];
                    this.files = new Map(data.files || []);
                    this.currentFile = data.currentFile || '我的笔记.md';
                    this.lastSavedContent = data.lastSavedContent || '';
                    
                    // 加载当前文件内容
                    const currentFileData = this.files.get(this.currentFile);
                    if (currentFileData) {
                        document.getElementById('noteEditor').value = currentFileData.content;
                        this.currentContent = currentFileData.content;
                    }
                }
            }
        }
        
        // 全局实例
        let gitManager;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            gitManager = new GitNotesManager();
            
            // 监听编辑器内容变化
            const editor = document.getElementById('noteEditor');
            editor.addEventListener('input', () => {
                gitManager.currentContent = editor.value;
                gitManager.updateStatus();
            });
            
            // 自动保存
            setInterval(() => {
                if (gitManager.currentContent !== gitManager.lastSavedContent) {
                    gitManager.saveNote();
                }
            }, 30000); // 30秒自动保存
        });
        
        // 全局函数
        function saveNote() {
            gitManager.saveNote();
        }
        
        function showCommitModal() {
            if (gitManager.currentContent === gitManager.lastSavedContent) {
                gitManager.showToast('没有需要提交的更改', 'warning');
                return;
            }
            
            document.getElementById('commitModal').classList.add('active');
            document.getElementById('commitMessage').focus();
        }
        
        function closeCommitModal() {
            document.getElementById('commitModal').classList.remove('active');
            document.getElementById('commitMessage').value = '';
            document.getElementById('commitDescription').value = '';
        }
        
        function commitChanges() {
            const message = document.getElementById('commitMessage').value.trim();
            const description = document.getElementById('commitDescription').value.trim();
            
            if (!message) {
                gitManager.showToast('请输入提交信息', 'error');
                return;
            }
            
            gitManager.commit(message, description);
            closeCommitModal();
        }
        
        function showDiff() {
            const diffArea = document.getElementById('diffArea');
            const diffContent = document.getElementById('diffContent');
            
            diffContent.innerHTML = gitManager.generateDiff();
            diffArea.classList.add('active');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                diffArea.classList.remove('active');
            }, 10000);
        }
        
        function createBranch() {
            document.getElementById('branchModal').classList.add('active');
            document.getElementById('branchName').focus();
        }
        
        function closeBranchModal() {
            document.getElementById('branchModal').classList.remove('active');
            document.getElementById('branchName').value = '';
            document.getElementById('branchDescription').value = '';
        }
        
        function createNewBranch() {
            const name = document.getElementById('branchName').value.trim();
            const description = document.getElementById('branchDescription').value.trim();
            
            if (!name) {
                gitManager.showToast('请输入分支名称', 'error');
                return;
            }
            
            if (gitManager.createBranch(name, description)) {
                closeBranchModal();
            }
        }
        
        function newNote() {
            const fileName = prompt('请输入新笔记的文件名:', '新笔记.md');
            if (fileName) {
                document.getElementById('currentFileName').textContent = fileName;
                document.getElementById('noteEditor').value = '';
                gitManager.currentFile = fileName;
                gitManager.currentContent = '';
                gitManager.lastSavedContent = '';
                gitManager.updateUI();
            }
        }
        
        function loadNote() {
            // 这里可以实现文件选择器
            gitManager.showToast('文件加载功能开发中...', 'info');
        }
        
        function loadFile(fileName) {
            const file = gitManager.files.get(fileName);
            if (file) {
                document.getElementById('currentFileName').textContent = fileName;
                document.getElementById('noteEditor').value = file.content;
                gitManager.currentFile = fileName;
                gitManager.currentContent = file.content;
                gitManager.updateUI();
            }
        }
        
        function viewCommit(commitId) {
            const commit = gitManager.commits.find(c => c.id === commitId);
            if (commit) {
                alert(`提交详情:\n\n消息: ${commit.message}\n描述: ${commit.description}\n时间: ${new Date(commit.timestamp).toLocaleString()}\n分支: ${commit.branch}\n作者: ${commit.author}`);
            }
        }
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 's':
                        e.preventDefault();
                        saveNote();
                        break;
                    case 'Enter':
                        if (e.shiftKey) {
                            e.preventDefault();
                            showCommitModal();
                        }
                        break;
                }
            }
        });
        
        // 点击模态框外部关闭
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });
    </script>
</body>
</html>
